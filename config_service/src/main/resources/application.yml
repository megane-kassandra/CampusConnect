server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # native (dossier local) ou git (dépôt Git) : variable CONFIG_BACKEND
    active: ${CONFIG_BACKEND:native}

# Clé symétrique : active /encrypt, /decrypt et le déchiffrement des valeurs {cipher}...
encrypt:
  key: ${ENCRYPT_KEY}

config:
  security:
    client-password: ${CONFIG_CLIENT_PASSWORD}
    admin-password: ${CONFIG_ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_NATIVE_PATH:file:../config-repo/}

---
spring:
  config:
    activate:
      on-profile: git
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: ${CONFIG_GIT_LABEL:main}
          clone-on-start: true
          force-pull: true
          username: ${CONFIG_GIT_USERNAME:}
          password: ${CONFIG_GIT_TOKEN:}