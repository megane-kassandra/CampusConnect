{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Connexion par reconnaissance faciale</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #20242a; }
    video { width: 100%; max-height: 520px; background: #111; border-radius: 12px; }
    .controls { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1rem 0; }
    button { padding: .75rem 1rem; border: 0; border-radius: 8px; background: #1456c0; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { padding: 1rem; border-radius: 8px; background: #f0f3f7; min-height: 1.4rem; }
  </style>
</head>
<body data-recognition-url="{% url 'facial_auth:recognize' %}">
  <h1>Connexion par reconnaissance faciale</h1>
  <p>Place une seule personne devant la caméra.</p>
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="frame" hidden></canvas>
  <div class="controls">
    <button id="start">Activer la caméra</button>
    <button id="stop" disabled>Arrêter</button>
  </div>
  <div id="status" role="status" aria-live="polite">Caméra arrêtée.</div>
  <script src="{% static 'facial_auth/camera.js' %}" defer></script>
</body>
</html>
